services:
  - type: web
    name: family-photos
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn family_photos.wsgi
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: DATABASE_URL
        fromDatabase:
          name: family-photos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: family-photos-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: USE_S3
        value: "False"

  - type: worker
    name: family-photos-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A family_photos worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: DATABASE_URL
        fromDatabase:
          name: family-photos-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: family-photos-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: family-photos
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: USE_S3
        value: "False"

  - type: keyvalue
    name: family-photos-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: family-photos-db
    plan: free
    ipAllowList: []
