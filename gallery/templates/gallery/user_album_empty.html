{% extends 'base.html' %}
{% load static %}

{% block title %}{{ album.name }} by {{ profile_user.username }} - Family Event Photos{% endblock %}

{% block content %}
    <div class="flex-container align-center gap:1" style="margin-bottom: 2rem;">
        <a href="{% url 'gallery:user_albums' profile_user.pk %}" class="btn btn-purple">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            {{ profile_user.username }}'s Albums
        </a>
    </div>

    <div class="empty-state" style="min-height: 50vh;">
        <div class="empty-state-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
        </div>
        <p class="empty-state-text">{{ album.name }}</p>
        <p class="empty-state-subtext">This album is empty.</p>
    </div>
{% endblock %}
