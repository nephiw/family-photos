<div class="photo-card" data-photo-id="{{ photo.pk }}" data-detail-url="{% url 'gallery:photo_detail' photo.pk %}{% if album %}?album={{ album.pk }}{% endif %}" title="Click to view full photo">
    <div class="bulk-checkbox" style="display: none; position: absolute; top: 0.5rem; left: 0.5rem; z-index: 2;">
        <input type="checkbox" name="photos" value="{{ photo.pk }}" style="width: 1.4em; height: 1.4em; cursor: pointer;">
    </div>
    <div class="photo-img-wrapper">
        {% if photo.thumbnail %}
            <img src="{{ photo.thumbnail.url }}" alt="{{ photo.caption|default:'Family photo' }}" loading="lazy">
        {% else %}
            <div class="thumbnail-spinner">
                <div class="spinner-icon"></div>
                <span class="spinner-label">Generating thumbnail...</span>
            </div>
        {% endif %}
    </div>
    
    <div class="photo-card-info">
        <span class="photo-uploader">Uploader: @{{ photo.uploaded_by.username }}</span>
        <span class="photo-meta-inline">
            {% if photo.date_taken %}
            <span class="photo-date-taken">Taken: {{ photo.date_taken|date:"M d, Y" }}</span>
            {% endif %}
            <span class="photo-date-uploaded">Uploaded: {{ photo.uploaded_at|date:"M d, Y" }}</span>
        </span>
    </div>
</div>
